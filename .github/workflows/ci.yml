name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze, test, validate, and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Prepare CI-only Android configuration
        shell: bash
        run: |
          cp lib/firebase_options.example.dart lib/firebase_options.dart
          python -c 'import json; from pathlib import Path; data={"project_info":{"project_number":"1234567890","project_id":"autodentifyr-ci","storage_bucket":"autodentifyr-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:0000000000000000","android_client_info":{"package_name":"com.vineetsarpal.autodentifyr"}},"oauth_client":[],"api_key":[{"current_key":"ci-placeholder-not-a-real-key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}; Path("android/app/google-services.json").write_text(json.dumps(data), encoding="utf-8")'
          keytool -genkeypair -keystore /tmp/autodentifyr-ci.jks -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          printf '%s\n' \
            'storePassword=android' \
            'keyPassword=android' \
            'keyAlias=androiddebugkey' \
            'storeFile=/tmp/autodentifyr-ci.jks' \
            > android/key.properties

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Run validator unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s test/tools -p "test_*.py"

      - name: Validate Phase 1 evaluation corpus
        run: python tool/phase_one_corpus_validator.py

      - name: Validate Phase 1 pricing evidence
        run: python tool/phase_one_pricing_validator.py

      - name: Validate contextual pricing evidence
        run: python tool/contextual_pricing_validator.py

      - name: Validate severity evidence
        run: python tool/severity_evidence_validator.py

      - name: Build Android debug APK
        run: flutter build apk --debug
